name: CURESP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check and test
        run: npm run check

  security-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Security invariants
        run: npm run security:check
      - name: Dependency audit high or critical
        run: npm audit --omit=dev --audit-level=high
      - name: Release static gate
        run: npm run release:gate

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            '.\BUILD-WINDOWS-PACKAGE.ps1',
            '.\SISDEV-GATE.ps1',
            '.\CURESP-GATE.ps1',
            '.\INICIAR-CURESP.ps1',
            '.\windows\INSTALAR-SIDES.ps1',
            '.\windows\launcher\Run-SIDES.ps1',
            '.\windows\launcher\Update-SIDES.ps1',
            '.\windows\launcher\Rollback-SIDES.ps1',
            '.\windows\launcher\Desinstalar-SIDES.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Build verified Windows package with absolute output path
        shell: powershell
        run: |
          $absoluteDist = [IO.Path]::GetFullPath((Join-Path $PWD 'dist'))
          .\BUILD-WINDOWS-PACKAGE.ps1 -OutputDir $absoluteDist
      - name: Installed package smoke test
        shell: powershell
        run: |
          $zip = Get-ChildItem .\dist\CURESP-*-windows-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'PACKAGE_ZIP_MISSING' }
          $shaFile = $zip.FullName + '.sha256'
          $declared = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declared -ne $actual) { throw 'PACKAGE_ZIP_CHECKSUM_MISMATCH' }

          $extract = Join-Path $env:RUNNER_TEMP 'curesp-release-package'
          $install = Join-Path $env:RUNNER_TEMP 'curesp-release-install'
          $data = Join-Path $env:RUNNER_TEMP 'curesp-release-data'
          Remove-Item $extract,$install,$data -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          node .\scripts\verify-windows-package.mjs $extract | Out-Null

          if (-not (Test-Path (Join-Path $extract 'INSTALAR-CURESP.ps1'))) { throw 'CURESP_INSTALLER_MISSING' }
          if (-not (Test-Path (Join-Path $extract 'INSTALAR-CURESP.vbs'))) { throw 'CURESP_VBS_INSTALLER_MISSING' }
          & (Join-Path $extract 'INSTALAR-CURESP.ps1') -InstallRoot $install -DataDir $data -NoLaunch -NoShortcuts -Silent
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_INSTALL_SMOKE_FAILED' }
          $state = Get-Content (Join-Path $install 'install-state.json') -Raw | ConvertFrom-Json
          if ($state.schema -ne 'SIDES-INSTALL-V1' -or $state.version -ne '1.0.0') { throw 'WINDOWS_INSTALL_STATE_INVALID' }
          if ([IO.Path]::GetFullPath([string]$state.dataDir) -ne [IO.Path]::GetFullPath($data)) { throw 'WINDOWS_DATA_DIR_CHANGED' }
          if (-not (Test-Path (Join-Path $install 'CURESP.vbs'))) { throw 'CURESP_LAUNCHER_MISSING' }
          $current = Join-Path $install ([string]$state.current)
          if (-not (Test-Path (Join-Path $current 'runtime\NODE-LICENSE.txt'))) { throw 'NODE_LICENSE_NOT_INSTALLED' }

          $env:SIDES_PORT = '4321'
          $env:SIDES_DATA_DIR = $data
          $node = Join-Path $current 'runtime\node.exe'
          $server = Join-Path $current 'src\server.mjs'
          $process = Start-Process -FilePath $node -ArgumentList ('"'+$server+'"') -WorkingDirectory $install -WindowStyle Hidden -PassThru
          try {
            $health = $null
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4321/api/health' -TimeoutSec 1; break } catch {}
            }
            if (-not $health -or $health.app -ne 'SIDES' -or $health.schema -ne 'SIDES-API-V9') { throw 'INSTALLED_RUNTIME_HEALTH_FAILED' }
            if (-not (Test-Path (Join-Path $data 'sides.sqlite'))) { throw 'INSTALLED_DATA_DIR_NOT_USED' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CURESP-Windows-${{ github.sha }}
          path: |
            dist/CURESP-*-windows-x64.zip
            dist/CURESP-*-windows-x64.zip.sha256
          retention-days: 30
