name: SIDES CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check and test
        run: npm run check

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            '.\BUILD-WINDOWS-PACKAGE.ps1',
            '.\windows\INSTALAR-SIDES.ps1',
            '.\windows\launcher\Run-SIDES.ps1',
            '.\windows\launcher\Update-SIDES.ps1',
            '.\windows\launcher\Desinstalar-SIDES.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Build verified Windows package
        shell: powershell
        run: .\BUILD-WINDOWS-PACKAGE.ps1 -OutputDir dist
      - name: Portable runtime smoke test
        shell: powershell
        run: |
          $zip = Get-ChildItem .\dist\SIDES-*-windows-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'PACKAGE_ZIP_MISSING' }
          $shaFile = $zip.FullName + '.sha256'
          $declared = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declared -ne $actual) { throw 'PACKAGE_ZIP_CHECKSUM_MISMATCH' }
          $extract = Join-Path $env:RUNNER_TEMP 'sides-package-smoke'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          node .\scripts\verify-windows-package.mjs $extract | Out-Null
          $env:SIDES_PORT = '4321'
          $env:SIDES_DATA_DIR = Join-Path $env:RUNNER_TEMP 'sides-package-data'
          Remove-Item $env:SIDES_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          $node = Join-Path $extract 'payload\runtime\node.exe'
          $server = Join-Path $extract 'payload\src\server.mjs'
          $process = Start-Process -FilePath $node -ArgumentList ('"'+$server+'"') -WorkingDirectory $extract -WindowStyle Hidden -PassThru
          try {
            $health = $null
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4321/api/health' -TimeoutSec 1; break } catch {}
            }
            if (-not $health -or $health.app -ne 'SIDES' -or $health.schema -ne 'SIDES-API-V9') { throw 'PORTABLE_RUNTIME_HEALTH_FAILED' }
            if (-not (Test-Path (Join-Path $env:SIDES_DATA_DIR 'sides.sqlite'))) { throw 'PORTABLE_DATA_DIR_NOT_USED' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload Windows package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SIDES-Windows-${{ github.sha }}
          path: |
            dist/SIDES-*-windows-x64.zip
            dist/SIDES-*-windows-x64.zip.sha256
          retention-days: 14
